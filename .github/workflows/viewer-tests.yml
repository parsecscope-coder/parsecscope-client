name: Viewer regression tests
on:
  push:
    paths: ['samples/**', 'tools/test_nifti.cjs', '.github/workflows/viewer-tests.yml']
  pull_request:
    paths: ['samples/**', 'tools/test_nifti.cjs', '.github/workflows/viewer-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/test_nifti.cjs
